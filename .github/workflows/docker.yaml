name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      # Step 1: Checkout the repo
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Docker login
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build Docker image (my-image)
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-image:latest .

      # Step 4: Push Docker image
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-image:latest

      # Step 5: Stop and remove old container (if exists)
      - name: Stop Old Container
        run: |
          if [ $(docker ps -q -f name=mycontainer) ]; then
            docker rm -f mycontainer
          fi

      # Step 6: Run new container (mycontainer)
      - name: Run New Container
        run: docker run -d -p 5000:5000 --name mycontainer ${{ secrets.DOCKER_USERNAME }}/my-image:latest

